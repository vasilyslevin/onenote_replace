name: Build and release Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build EXE
        shell: powershell
        run: ./scripts/build.ps1

      - name: Verify EXE
        shell: powershell
        run: |
          foreach ($file in @('dist/OneNoteReplace.exe', 'dist/SHA256SUMS.txt')) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Build failed: $file was not created."
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Build failed: $file is empty."
            }
          }

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneNoteReplace-Windows
          path: |
            dist/OneNoteReplace.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/OneNoteReplace.exe" `
            "dist/SHA256SUMS.txt" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
